server {
  listen 80;

  # The page itself: index.html, style.css, app.js
  location / {
    root /usr/share/nginx/html;
  }

  # Anything starting with /api/ is passed to the backend, found by its name.
  location /api/ {
    resolver 127.0.0.11 valid=5s;      # Docker's phone book: look "backend" up again every 5s
    set $backend http://backend:3000;
    proxy_pass $backend;
  }
}
