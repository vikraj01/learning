name: labfix

services:
  web:
    build: ./web
    environment:
      API_URL: http://api:4000
    ports:
      - "3504:80"
    depends_on:
      - api

  api:
    build: ./api
    environment:
      DB_HOST: database
      DB_USER: notes
     DB_PASSWORD: secret
      DB_NAME: notes
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: notes
